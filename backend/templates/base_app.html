{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard — EduNest{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: {
      50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca',900:'#312e81' } } } } }
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% include "partials/_form_styles.html" %}
</head>
<body class="h-full bg-slate-100 text-slate-800 antialiased" x-data="{ sidebar:false }">
<div class="relative min-h-screen items-start lg:flex">
  {% include "partials/_sidebar.html" %}

  <!-- mobile overlay -->
  <div x-show="sidebar" @click="sidebar=false" x-cloak
       class="fixed inset-0 z-20 bg-black/40 lg:hidden"></div>

  <div class="flex-1 min-w-0 flex min-h-screen flex-col">
    {% include "partials/_topbar.html" %}
    <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6">
      <div class="mx-auto max-w-7xl">
        {% include "partials/_messages_plain.html" %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</div>
<style>[x-cloak]{display:none!important}</style>
</body>
</html>
