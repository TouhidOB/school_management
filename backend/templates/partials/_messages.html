{% if messages %}
<div class="mx-auto max-w-6xl px-4 pt-4 space-y-2" x-data>
  {% for m in messages %}
  <div x-data="{show:true}" x-show="show"
       class="flex items-start justify-between rounded-lg px-4 py-3 text-sm
       {% if m.tags == 'error' %}bg-red-50 text-red-700 ring-1 ring-red-200
       {% elif m.tags == 'success' %}bg-green-50 text-green-700 ring-1 ring-green-200
       {% elif m.tags == 'warning' %}bg-amber-50 text-amber-700 ring-1 ring-amber-200
       {% else %}bg-brand-50 text-brand-700 ring-1 ring-brand-100{% endif %}">
    <span>{{ m }}</span>
    <button @click="show=false" class="ml-4 opacity-60 hover:opacity-100">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
