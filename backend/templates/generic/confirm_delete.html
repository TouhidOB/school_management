{% extends "base_app.html" %}
{% block page_title %}Delete{% endblock %}
{% block content %}
<div class="max-w-lg rounded-xl bg-white ring-1 ring-slate-200 p-6">
  <h2 class="text-lg font-semibold text-slate-800">Delete {{ object }}?</h2>
  <p class="mt-2 text-sm text-slate-500">This action cannot be undone.</p>
  <form method="post" class="mt-6 flex items-center gap-3">
    {% csrf_token %}
    <button class="rounded-lg bg-red-600 px-5 py-2 text-sm font-medium text-white hover:bg-red-700">Delete</button>
    <a href="{{ cancel_url }}" class="text-sm text-slate-500 hover:text-slate-700">Cancel</a>
  </form>
</div>
{% endblock %}
