# Reverse proxy: single entrypoint for the whole stack.
#   /api, /admin, /healthz, /static, /media  -> Django (gunicorn)
#   everything else                          -> Next.js (node)
# TLS terminates here in a real deploy; add a 443 server + certs then.

upstream backend {
    server backend:8000;
}
upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Uploads (student photos, PDFs) can be large-ish; admissions docs too.
    client_max_body_size 25m;

    # --- Django-served collected static (admin + DRF browsable API) ----------
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    # --- User-uploaded media (shared volume with the backend) ----------------
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # --- API + Django admin --------------------------------------------------
    location ~ ^/(api|admin|healthz)/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js frontend (everything else) ----------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;   # HMR / websockets
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
