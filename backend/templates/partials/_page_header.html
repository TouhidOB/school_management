<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
  <div>
    <h2 class="text-xl font-semibold text-slate-800">{{ header }}</h2>
    {% if subheader %}<p class="text-sm text-slate-500 mt-0.5">{{ subheader }}</p>{% endif %}
  </div>
  {% if action_url %}
  <a href="{{ action_url }}" class="inline-flex items-center gap-1.5 rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    {{ action_label|default:"New" }}
  </a>
  {% endif %}
</div>
