<header class="sticky top-0 z-10 h-16 bg-white/95 backdrop-blur border-b border-slate-200 flex items-center gap-3 px-4 sm:px-6 lg:px-8">
  <button @click="sidebar=true" class="lg:hidden text-slate-500 hover:text-slate-800">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="min-w-0">
    <h1 class="text-base font-semibold text-slate-800 truncate">{% block page_title %}{% endblock %}</h1>
    {% if request.school %}<p class="text-xs text-slate-400 truncate">{{ request.school.name }}</p>{% endif %}
  </div>

  <div class="ml-auto flex items-center gap-4">
    {% if user.role == 'super_admin' and request.school %}
    <span class="hidden sm:flex items-center gap-2 rounded-full bg-amber-50 px-3 py-1 text-xs font-medium text-amber-700 ring-1 ring-amber-200">
      Managing {{ request.school.name }}
      <a href="{% url 'exit_school' %}" class="rounded bg-amber-600 px-2 py-0.5 text-white hover:bg-amber-700">Exit</a>
    </span>
    {% endif %}
    <a href="{% url 'notification_list' %}" class="relative text-slate-400 hover:text-slate-700">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1"/></svg>
    </a>
    <div class="relative" x-data="{open:false}">
      <button @click="open=!open" class="flex items-center gap-2">
        <span class="grid h-9 w-9 place-items-center rounded-full bg-brand-100 text-brand-700 font-semibold">
          {{ user.username|first|upper }}
        </span>
        <span class="hidden sm:block text-left leading-tight">
          <span class="block text-sm font-medium text-slate-700">{{ user.get_full_name|default:user.username }}</span>
          <span class="block text-xs text-slate-400">{{ user.get_role_display }}</span>
        </span>
      </button>
      <div x-show="open" @click.outside="open=false" x-cloak
           class="absolute right-0 mt-2 w-48 rounded-xl bg-white shadow-lg ring-1 ring-slate-200 py-1 text-sm z-40">
        <a href="{% url 'settings' %}" class="block px-4 py-2 hover:bg-slate-50">Settings</a>
        <a href="/admin/" class="block px-4 py-2 hover:bg-slate-50">Django admin</a>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}
          <button class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</header>
